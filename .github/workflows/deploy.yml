name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build server
        run: pnpm run build
        working-directory: ./server
      
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-token: ${{ secrets.EXPO_TOKEN }}
          expo-cache: true
      
      - name: Install EAS CLI
        run: npx eas-cli@latest --version
      
      - name: Configure EAS
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          echo "$EAS_TOKEN" | npx eas-cli@latest login --json
          npx eas-cli@latest update:configure --non-interactive --platform android
        working-directory: ./client
      
      - name: Publish EAS Update
        if: success()
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          npx eas-cli@latest update --branch production --message "${{ github.event.head_commit.message }}"
        working-directory: ./client
